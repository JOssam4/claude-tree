name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters only apply to branch pushes; tag pushes always run. On main,
    # only a change to the app's package.json can be a version bump, and the
    # version job then checks that it really is one.
    paths:
      - packages/electron/package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every run that builds may publish a release, so let each one finish.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether to build and which tag (if any) to release:
  # - a pushed v* tag builds and releases that tag;
  # - main builds and releases only when its packages/electron version hasn't
  #   been tagged yet (the release job then creates the tag);
  # - a manual run always builds, releasing only under the same rule as main.
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/electron/package.json
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || exit 0
          tag="v$(node -p "require('./packages/electron/package.json').version")"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag is already tagged; nothing to release"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement of the compiled node-pty low.
          - name: linux-x64
            runner: ubuntu-22.04
            builder-args: --linux --x64
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            builder-args: --linux --arm64
          # One Apple Silicon runner builds both mac architectures.
          - name: mac
            runner: macos-latest
            builder-args: --mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./packages/electron/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/electron/package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Test
        if: matrix.name == 'linux-x64'
        run: npm test

      - run: npm run build

      # electron-builder's bundled fpm (used for .deb) only runs on x64 hosts.
      - name: Install fpm
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Package
        working-directory: packages/electron
        env:
          # Builds are ad-hoc signed (mac.identity "-") for now; don't pick up stray certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: Check native module architectures (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/electron/release
        run: |
          if [ "${{ matrix.name }}" = linux-x64 ]; then
            ../../../.github/scripts/check-native-arch.sh linux-unpacked/resources/app.asar.unpacked x86-64
          else
            ../../../.github/scripts/check-native-arch.sh linux-arm64-unpacked/resources/app.asar.unpacked aarch64
          fi

      - name: Check native module architectures and signatures (mac)
        if: runner.os == 'macOS'
        working-directory: packages/electron/release
        run: |
          ../../../.github/scripts/check-native-arch.sh "mac/Claude Tree.app/Contents/Resources/app.asar.unpacked" x86_64
          ../../../.github/scripts/check-native-arch.sh "mac-arm64/Claude Tree.app/Contents/Resources/app.asar.unpacked" arm64
          # Apple Silicon refuses to launch apps without at least an ad-hoc signature.
          codesign --verify --deep --strict --verbose=2 "mac/Claude Tree.app"
          codesign --verify --deep --strict --verbose=2 "mac-arm64/Claude Tree.app"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-tree-${{ matrix.name }}
          path: |
            packages/electron/release/*.dmg
            packages/electron/release/*.zip
            packages/electron/release/*.AppImage
            packages/electron/release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la dist
          # Create the release with its assets in one step so it never goes live empty;
          # a rerun for an existing release just replaces the assets. For a missing
          # tag, --target creates it at the commit that was built. Tags created with
          # GITHUB_TOKEN don't trigger workflows, so this doesn't kick off a rebuild.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
